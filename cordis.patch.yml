# Replace the shipped root layout while preserving the sidebar, conversation,
# details, and overlay slot contracts for the existing Web feature plugins.
- id: ui-layout
  disabled: true

- insert:
    - id: workspace-studio
      name: '@yishengjun8/dsh-workspace-studio'
      config:
        enableEditing: true
        maxContextBytes: 65536
        maxPromptContextBytes: 69632
        maxContextSourceBytes: 10485760
        maxEditableBytes: 1048576
        maxPreviewBytes: 1048576
